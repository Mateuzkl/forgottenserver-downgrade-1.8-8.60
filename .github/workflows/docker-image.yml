name: Build Docker Image (Linux)

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - ".github/workflows/docker-image.yml"
      - ".github/scripts/native-changes.sh"
      - ".github/tests/native_changes.sh"
      - "src/**"
      - "cmake/**"
      - "data/**"
      - "vc18/**"
      - CMakeLists.txt
      - vcpkg.json
      - vcpkg-configuration.json
      - "vcpkg-overlays/**"

  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - ".github/workflows/docker-image.yml"
      - ".github/scripts/native-changes.sh"
      - ".github/tests/native_changes.sh"
      - "src/**"
      - "cmake/**"
      - "data/**"
      - "vc18/**"
      - CMakeLists.txt
      - vcpkg.json
      - vcpkg-configuration.json
      - "vcpkg-overlays/**"

  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.native.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test native build selection
        run: bash .github/tests/native_changes.sh
      - name: Detect native changes
        id: native
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/native-changes.sh

  build:
    name: Docker build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Show Docker version
        run: docker version

      - name: Build Docker image
        run: |
          set -e
          max_attempts=3
          attempt=0
          until [ "$attempt" -ge "$max_attempts" ]; do
            attempt=$((attempt+1))
            echo "Docker build attempt $attempt/$max_attempts..."
            if docker build --pull --file ./Dockerfile --tag tfs-linux:latest .; then
              echo "Docker build succeeded"
              break
            fi
            echo "Docker build failed (attempt $attempt)."
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep_seconds=$(( attempt * 10 ))
              echo "Retrying in ${sleep_seconds}s..."
              sleep $sleep_seconds
            else
              echo "Docker build failed after $max_attempts attempts"
              exit 1
            fi
          done
